name: Release Theme

on:
  push:
    tags:
      - theme-v*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.20.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # Themes ship .vue/.ts sources directly — no build step needed

      # Same provenance workaround as release.yml: pnpm 11's token-auth publish
      # drops provenance, so pack with pnpm (resolves catalog:/workspace: deps)
      # and publish the tarball with npm.
      - name: Publish theme package
        working-directory: themes/slidev-theme-supa11y
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public
