name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build CLI package
        run: pnpm --filter create-supaslidev build

      - name: Build supaslidev package
        run: pnpm --filter supaslidev build

      # pnpm 11 dropped NPM_CONFIG_PROVENANCE support in its token-auth publish path
      # (and its OIDC path 404s until a trusted publisher is configured on npmjs.com),
      # which silently shipped v0.4.3 without provenance. Pack with pnpm so that
      # catalog:/workspace: deps get resolved, then publish the tarball with npm,
      # which still generates provenance from NODE_AUTH_TOKEN + id-token: write.
      - name: Publish CLI package
        working-directory: packages/cli
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public

      - name: Publish supaslidev package
        working-directory: packages/supaslidev
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public

      - name: Create GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
