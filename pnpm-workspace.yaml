packages:
  - packages/*
  - themes/*
  - playground
  - playground/packages/*
  - playground/presentations/*
  - docs

catalog:
  '@slidev/cli': ^52.20.1
  '@slidev/theme-apple-basic': latest
  '@slidev/theme-default': latest
  '@slidev/theme-seriph': latest
  knip: ^6.41.0
  playwright-chromium: ^1.64.1
  vue: ^3.5.44

catalogMode: prefer

catalogs:
  cli:
    '@clack/prompts': ^1.8.1
    commander: ^15.0.0
    ejs: ^6.0.1
    js-yaml: ^5.5.0
    picocolors: ^1.1.1
    ts-morph: ^28.0.0
    yaml: ^2.9.1
  core:
    '@nuxt/devtools-kit': ^4.0.0-beta.5
    sharp: ^0.35.5
    '@nuxt/kit': ^4.5.2
    '@nuxt/schema': ^4.5.2
    '@nuxt/ui': ^4.12.0
    '@vitejs/plugin-vue': ^6.0.10
    '@vue/compiler-sfc': ^3.5.44
    better-sqlite3: ^12.11.1
    docus: ^5.15.0
    mermaid: ^11.17.2
    nuxt: ^4.5.2
    tailwindcss: ^4.3.3
    vite: ^8.3.4
    vue-router: ^5.4.0
    vue-tsc: ^3.3.13
    zod: ^4.6.7
    zod-to-json-schema: ^3.25.2
  dev:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    '@types/ejs': ^3.1.5
    '@types/js-yaml': ^4.0.9
    '@types/node': ^26.6.5
    '@vitest/browser': 4.1.12
    '@vitest/browser-playwright': 4.1.12
    '@vitest/coverage-v8': 4.1.12
    '@vitest/ui': ^4.1.12
    bumpp: ^12.3.0
    changelogen: ^0.6.2
    changelogithub: ^15.0.5
    husky: ^9.1.7
    lint-staged: ^17.6.0
    oxfmt: ^0.73.0
    oxlint: ^1.88.0
    playwright: ^1.64.1
    playwright-chromium: ^1.64.1
    tsdown: ^0.23.1
    tsx: ^4.23.15
    turbo: ^2.11.8
    typescript: ^6.0.3
    vitest: ^4.1.12

ignoredOptionalDependencies:
  - '@resvg/resvg-js-android-arm-eabi'
  - '@resvg/resvg-js-android-arm64'
  - '@resvg/resvg-js-darwin-x64'
  - '@resvg/resvg-js-linux-arm-gnueabihf'
  - '@resvg/resvg-js-linux-arm64-gnu'
  - '@resvg/resvg-js-linux-arm64-musl'
  - '@resvg/resvg-js-linux-x64-gnu'
  - '@resvg/resvg-js-linux-x64-musl'
  - '@resvg/resvg-js-win32-arm64-msvc'
  - '@resvg/resvg-js-win32-ia32-msvc'
  - '@resvg/resvg-js-win32-x64-msvc'

linkWorkspacePackages: true

overrides:
  oxc-parser: 0.154.0

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  playwright-chromium: true
  sharp: true
  vue-demi: true

shellEmulator: true

trustPolicy: accept

trustPolicyExclude:
  - axios
  - chokidar
  - semver
  - undici
  - undici-types
  - vite

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - '@vue/language-core@3.3.10'
  - js-yaml@5.3.0
  - turbo@2.10.10
  - vue-tsc@3.3.10
