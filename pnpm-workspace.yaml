packages:
  - packages/*
  - playground
  - playground/packages/*
  - playground/presentations/*
  - docs

catalog:
  '@slidev/cli': ^52.11.3
  '@slidev/theme-default': latest
  '@slidev/theme-seriph': latest
  '@slidev/theme-apple-basic': latest
  playwright-chromium: ^1.58.2
  vue: ^3.5.31

catalogMode: prefer

catalogs:
  cli:
    '@clack/prompts': ^0.9.1
    commander: ^13.1.0
    ejs: ^3.1.10
    js-yaml: ^4.1.1
    picocolors: ^1.1.1
    ts-morph: ^24.0.0
    yaml: ^2.7.0
  core:
    '@nuxt/ui': ^4.4.0
    '@vitejs/plugin-vue': ^5.2.1
    '@vue/compiler-sfc': ^3.5.31
    '@nuxt/kit': ^4.4.2
    '@nuxt/schema': ^4.4.2
    better-sqlite3: ^12.2.0
    docus: ^5.4.4
    mermaid: ^11.12.2
    nuxt: ^4.4.2
    tailwindcss: ^4.1.18
    vite: ^6.0.7
    vue-router: ^4.6.4
    vue-tsc: ^2.0.0
    zod: ^3.24.0
    zod-to-json-schema: ^3.24.0
  dev:
    '@commitlint/cli': ^20.3.1
    '@commitlint/config-conventional': ^20.3.1
    bumpp: ^11.0.1
    changelogen: ^0.6.2
    changelogithub: ^14.0.0
    '@types/ejs': ^3.1.5
    '@types/js-yaml': ^4.0.9
    '@types/node': ^22.10.0
    '@vitest/browser': 4.0.17
    '@vitest/browser-playwright': 4.0.17
    '@vitest/coverage-v8': 4.0.17
    '@vitest/ui': ^4.0.18
    husky: ^9.1.7
    lint-staged: ^16.2.7
    oxfmt: ^0.26.0
    oxlint: ^1.41.0
    playwright: ^1.49.0
    playwright-chromium: ^1.58.2
    tsdown: ^0.21.0
    tsx: ^4.19.0
    turbo: ^2.7.5
    typescript: ^5.3.3
    vitest: ^4.0.0

ignoredOptionalDependencies:
  - '@resvg/resvg-js-android-arm-eabi'
  - '@resvg/resvg-js-android-arm64'
  - '@resvg/resvg-js-darwin-x64'
  - '@resvg/resvg-js-linux-arm-gnueabihf'
  - '@resvg/resvg-js-linux-arm64-gnu'
  - '@resvg/resvg-js-linux-arm64-musl'
  - '@resvg/resvg-js-linux-x64-gnu'
  - '@resvg/resvg-js-linux-x64-musl'
  - '@resvg/resvg-js-win32-arm64-msvc'
  - '@resvg/resvg-js-win32-ia32-msvc'
  - '@resvg/resvg-js-win32-x64-msvc'

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - playwright-chromium
  - sharp
  - vue-demi

shellEmulator: true

trustPolicy: accept

trustPolicyExclude:
  - axios
  - chokidar
  - semver
  - undici
  - undici-types
  - vite
