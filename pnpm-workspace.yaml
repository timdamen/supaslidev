packages:
  - packages/*
  - playground
  - playground/packages/*
  - playground/presentations/*
  - docs

catalog:
  '@slidev/cli': ^52.16.0
  '@slidev/theme-apple-basic': latest
  '@slidev/theme-default': latest
  '@slidev/theme-seriph': latest
  knip: '~6.6.1'
  playwright-chromium: ^1.60.0
  vue: ^3.5.35

catalogMode: prefer

catalogs:
  cli:
    '@clack/prompts': ^1.5.1
    commander: ^15.0.0
    ejs: ^6.0.1
    js-yaml: ^4.2.0
    picocolors: ^1.1.1
    ts-morph: ^28.0.0
    yaml: ^2.9.0
  core:
    '@nuxt/devtools-kit': ^4.0.0-alpha.7
    '@nuxt/kit': ^4.4.7
    '@nuxt/schema': ^4.4.7
    '@nuxt/ui': ^4.6.1
    '@vitejs/plugin-vue': ^6.0.7
    '@vue/compiler-sfc': ^3.5.35
    better-sqlite3: ^12.10.0
    docus: 5.10.0
    mermaid: ^11.15.0
    nuxt: ^4.4.7
    sharp: ^0.34.5
    tailwindcss: ^4.3.0
    vite: ^8.0.16
    vue-router: ^5.1.0
    vue-tsc: ^3.3.3
    zod: ^4.3.6
    zod-to-json-schema: ^3.25.2
  dev:
    '@commitlint/cli': ^20.5.3
    '@commitlint/config-conventional': ^20.5.3
    '@types/ejs': ^3.1.5
    '@types/js-yaml': ^4.0.9
    '@types/node': ^24.13.0
    '@vitest/browser': 4.1.8
    '@vitest/browser-playwright': 4.1.8
    '@vitest/coverage-v8': 4.1.8
    '@vitest/ui': ^4.1.8
    bumpp: ^11.1.0
    changelogen: ^0.6.2
    changelogithub: ^14.0.0
    husky: ^9.1.7
    lint-staged: ^17.0.7
    oxfmt: ^0.53.0
    oxlint: ^1.68.0
    playwright: ^1.60.0
    playwright-chromium: ^1.60.0
    tsdown: ^0.22.2
    tsx: ^4.22.4
    turbo: ^2.9.16
    typescript: ^6.0.3
    vitest: ^4.1.8

ignoredOptionalDependencies:
  - '@resvg/resvg-js-android-arm-eabi'
  - '@resvg/resvg-js-android-arm64'
  - '@resvg/resvg-js-darwin-x64'
  - '@resvg/resvg-js-linux-arm-gnueabihf'
  - '@resvg/resvg-js-linux-arm64-gnu'
  - '@resvg/resvg-js-linux-arm64-musl'
  - '@resvg/resvg-js-linux-x64-gnu'
  - '@resvg/resvg-js-linux-x64-musl'
  - '@resvg/resvg-js-win32-arm64-msvc'
  - '@resvg/resvg-js-win32-ia32-msvc'
  - '@resvg/resvg-js-win32-x64-msvc'

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - playwright-chromium
  - sharp
  - vue-demi

shellEmulator: true

trustPolicy: accept

trustPolicyExclude:
  - axios
  - chokidar
  - semver
  - undici
  - undici-types
  - vite
